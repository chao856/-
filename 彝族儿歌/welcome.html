<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彝族儿歌音乐创作系统 - 欢迎</title>
    <style>
        .welcome-image {
            max-width: 80%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        :root {
            --indigo: #4B0082;
            --ivory: #FFFFF0;
            --dark-red: #8B0000;
            --light-indigo: #7D5AB6;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--ivory);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M10,10 Q20,5 30,10 Q40,15 50,10 Q60,5 70,10 Q80,15 90,10" stroke="%234B0082" fill="none" stroke-width="1" opacity="0.2"/></svg>');
            background-size: 200px 200px;
            background-repeat: repeat;
            color: #333;
        }
        
        .welcome-container {
            max-width: 800px;
            padding: 40px;
            text-align: center;
            border-radius: 16px;
        }
        
        h1 {
            color: var(--indigo);
            margin-bottom: 30px;
        }
        
        p {
            color: var(--dark-red);
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .enter-btn {
            padding: 15px 30px;
            font-size: 18px;
            background: linear-gradient(135deg, var(--indigo), var(--light-indigo));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        
        .enter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <img src="切片/images/40222.gif" alt="彝族文化切片" class="welcome-image">
        <h1>欢迎使用彝族儿歌音乐创作系统</h1>
        <p>这是一个专为创作和探索彝族传统儿歌而设计的工具，包含音色分析、歌词生成等功能。</p>
        <button class="enter-btn" onclick="location.href='index.html'">进入系统</button>
    </div>
</body>
</html>
